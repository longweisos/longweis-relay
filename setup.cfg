[metadata]
name = longweis-relay-client
version = 0.1.0
description = Auditable local client for Longweis Relay
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
author = Longweis OS
author_email = longweis.app@gmail.com
url = https://relay.longweisos.com/
project_urls =
    Documentation = https://github.com/longweisos/longweis-relay#readme
    Protocol = https://github.com/longweisos/longweis-relay/blob/main/docs/PROTOCOL_V1.md
    Security = https://github.com/longweisos/longweis-relay/security/policy
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: Apache Software License
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet :: WWW/HTTP :: HTTP Servers
    Topic :: Security

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.package_data]
longweis_relay_client = *.mjs

[options.entry_points]
console_scripts =
    relay-client = longweis_relay_client.cli:main
