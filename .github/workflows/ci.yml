name: public-client-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/audit_public_tree.py
      - run: python -m longweis_relay_client doctor --offline
        if: runner.os != 'Linux'
        env:
          PYTHONPATH: src
      - name: Verify headless Linux preflight fails closed without a secret store
        if: runner.os == 'Linux'
        run: |
          set +e
          python -m longweis_relay_client doctor --offline
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
        env:
          PYTHONPATH: src
      - run: python -m longweis_relay_client egress
        env:
          PYTHONPATH: src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: >-
          python -m pip install --disable-pip-version-check
          setuptools==79.0.1 wheel==0.48.0
      - run: python scripts/build_release.py --output release/v0.1.0
